<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bloodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DC143C"/>
      <stop offset="100%" stop-color="#8B0000"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Dark background circle -->
  <circle cx="16" cy="16" r="15" fill="#0D0D0D" stroke="#8B0000" stroke-width="1"/>
  
  <!-- Skull shape -->
  <ellipse cx="16" cy="14" rx="10" ry="9" fill="#E8E8E8" filter="url(#glow)"/>
  
  <!-- Eye sockets -->
  <ellipse cx="12" cy="13" rx="3" ry="3.5" fill="#0D0D0D"/>
  <ellipse cx="20" cy="13" rx="3" ry="3.5" fill="#0D0D0D"/>
  
  <!-- Red glowing eyes -->
  <circle cx="12" cy="13" r="1.5" fill="#DC143C">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="20" cy="13" r="1.5" fill="#DC143C">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Nose hole -->
  <path d="M16 16 L14.5 19 L17.5 19 Z" fill="#0D0D0D"/>
  
  <!-- Teeth -->
  <rect x="11" y="21" width="2" height="3" rx="0.5" fill="#E8E8E8"/>
  <rect x="14" y="21" width="2" height="3" rx="0.5" fill="#E8E8E8"/>
  <rect x="17" y="21" width="2" height="3" rx="0.5" fill="#E8E8E8"/>
  <rect x="20" y="21" width="2" height="3" rx="0.5" fill="#E8E8E8"/>
  
  <!-- Blood drips -->
  <ellipse cx="8" cy="28" rx="1.5" ry="3" fill="url(#bloodGrad)"/>
  <ellipse cx="24" cy="29" rx="1" ry="2" fill="url(#bloodGrad)"/>
</svg>
