<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Blood gradient for drip effects -->
    <linearGradient id="bloodGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DC143C"/>
      <stop offset="100%" stop-color="#8B0000"/>
    </linearGradient>
    
    <!-- Eerie glow filter -->
    <filter id="horrorGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Dark vignette gradient -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#1A1A1A" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0D0D0D" stop-opacity="0.8"/>
    </radialGradient>
  </defs>
  
  <!-- Background with dark atmosphere -->
  <circle cx="60" cy="60" r="58" fill="#0D0D0D"/>
  <circle cx="60" cy="60" r="58" fill="url(#vignette)"/>
  
  <!-- Outer ring with blood red glow -->
  <circle cx="60" cy="60" r="54" fill="none" stroke="#8B0000" stroke-width="2" filter="url(#horrorGlow)"/>
  
  <!-- Stylized "P" letter with horror treatment -->
  <g filter="url(#horrorGlow)">
    <!-- Main P shape -->
    <path 
      d="M40 30 L40 90 L50 90 L50 65 L70 65 C85 65 85 30 70 30 Z M50 40 L65 40 C72 40 72 55 65 55 L50 55 Z" 
      fill="#E8E8E8"
    />
    
    <!-- Blood drip from P -->
    <ellipse cx="50" cy="94" rx="3" ry="6" fill="url(#bloodGradient)">
      <animate attributeName="ry" values="6;8;6" dur="3s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="40" cy="96" rx="2" ry="4" fill="url(#bloodGradient)">
      <animate attributeName="ry" values="4;5;4" dur="2.5s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  
  <!-- Decorative cracks/scratches -->
  <path d="M75 35 L82 42 L78 38 L85 45" stroke="#DC143C" stroke-width="1" fill="none" opacity="0.6"/>
  <path d="M72 70 L78 78 L74 74 L80 82" stroke="#DC143C" stroke-width="1" fill="none" opacity="0.5"/>
  
  <!-- Subtle cobweb in corner -->
  <g opacity="0.3" stroke="#E8E8E8" stroke-width="0.5" fill="none">
    <path d="M95 15 Q90 20 85 15"/>
    <path d="M95 15 Q92 22 95 28"/>
    <path d="M95 15 L88 22"/>
    <path d="M88 22 Q85 18 82 22"/>
    <path d="M88 22 Q90 26 88 30"/>
  </g>
  
  <!-- Glowing red accent dots -->
  <circle cx="78" cy="47" r="2" fill="#DC143C" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
